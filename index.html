<style>

<body>

<input type="file" id="datei" accept=".json,application/json" hidden>

<script>

function achseX(keys, x, H, unten) {
  const schritt = Math.max(1, Math.ceil(keys.length / 6));
  let s = '';
  for (let i = keys.length - 1; i >= 0; i -= schritt) s += `<text x="${x(i)}" y="${H - unten + 18}" text-anchor="middle">${kurzDatum(keys[i])}</text>`;
  return s;
}
function zeichneCharts() {
  const keys = tageBereich(S.bereich), z = ziele(heute(), 'basis');
  const leer = t => `<p class="klein">${t}</p>`;
  /* Kalorien: Balken */
  const elK = $('cKcal'), daten = keys.map(k => { const t = lies(k); return t.eintraege.length ? summe(t.eintraege) : null; });
  if (!elK) { /* Kalorien-Diagramm nicht auf dieser Seite */ }
  else if (!daten.some(Boolean)) elK.innerHTML = leer('Noch keine Einträge in diesem Zeitraum.');
  else {
    const W = Math.max(280, elK.clientWidth), H = 220, L = 44, R = 6, O = 10, U = 26;
    const roh = Math.max(z.kcal || 0, ...daten.map(d => d ? d.kcal : 0)) * 1.08;
    const stufe = roh > 3200 ? 1000 : 500, max = Math.ceil(roh / stufe) * stufe;
    const y = v => O + (H - O - U) * (1 - v / max), slot = (W - L - R) / keys.length, x = i => L + slot * (i + .5);
    const bw = Math.max(2, Math.min(28, slot - 2));
    let s = '';
    for (let v = 0; v <= max; v += stufe) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linie)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${zahl(v)}</text>`;
    daten.forEach((d, i) => {
      if (!d || d.kcal <= 0) return;
      const zt = ziele(keys[i]).kcal;
      const x0 = x(i) - bw / 2, yt = y(d.kcal), yb = y(0), r = Math.min(4, bw / 2, yb - yt);
      s += `<path fill="${zt && d.kcal > zt ? 'var(--warn)' : 'var(--c-kcal)'}" d="M${x0} ${yb}V${yt + r}Q${x0} ${yt} ${x0 + r} ${yt}H${x0 + bw - r}Q${x0 + bw} ${yt} ${x0 + bw} ${yt + r}V${yb}Z"/>`;
    });
    if (z.kcal) s += `<line x1="${L}" x2="${W - R}" y1="${y(z.kcal)}" y2="${y(z.kcal)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    s += achseX(keys, x, H, U);
    daten.forEach((d, i) => {
      const zt = ziele(keys[i]).kcal;
      const tt = kurzDatum(keys[i]) + '\n' + (d ? `${zahl(Math.round(d.kcal))} kcal` + (zt ? (d.kcal > zt ? ` · ${zahl(Math.round(d.kcal - zt))} über Ziel` : ` · ${zahl(Math.round(zt - d.kcal))} unter Ziel`) : '') + `\nE ${zahl(Math.round(d.e))} · K ${zahl(Math.round(d.k))} · F ${zahl(Math.round(d.f))} g` : 'nichts erfasst');
      s += `<rect class="hit" x="${L + slot * i}" y="${O}" width="${slot}" height="${H - O - U}" data-tt="${esc(tt)}"/>`;
    });
    elK.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Kalorien je Tag">${s}</svg>`;
  }
  /* Gewicht: Linie */
  const elG = $('cKg'), pkt = keys.map((k, i) => ({ i, k, v: lies(k).gewicht })).filter(p => p.v != null);
  if (!elG) return;
  if (!pkt.length) { elG.innerHTML = leer('Noch kein Gewicht in diesem Zeitraum. Du trägst es unten auf der Seite „Heute" ein.'); return; }
  const W = Math.max(280, elG.clientWidth), H = 200, L = 44, R = 12, O = 10, U = 26;
  const zg = D.profil.zielgewicht, werte = pkt.map(p => p.v);
  let lo = Math.min(...werte), hi = Math.max(...werte);
  const zielSichtbar = zg != null && zg >= lo - 3 && zg <= hi + 3;
  if (zielSichtbar) { lo = Math.min(lo, zg); hi = Math.max(hi, zg); }
  lo = Math.floor(lo - .5); hi = Math.ceil(hi + .5);
  const stufe = hi - lo > 12 ? 5 : hi - lo > 5 ? 2 : 1;
  const y = v => O + (H - O - U) * (1 - (v - lo) / (hi - lo)), slot = (W - L - R) / keys.length, x = i => L + slot * (i + .5);
  let s = '';
  for (let v = Math.ceil(lo / stufe) * stufe; v <= hi; v += stufe) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linie)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  if (zielSichtbar) s += `<line x1="${L}" x2="${W - R}" y1="${y(zg)}" y2="${y(zg)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - R}" y="${y(zg) - 5}" text-anchor="end">Ziel ${zahl(zg, 1)} kg</text>`;
  if (pkt.length > 1) s += `<polyline fill="none" stroke="var(--akzent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pkt.map(p => x(p.i) + ',' + y(p.v)).join(' ')}"/>`;
  const dicht = pkt.length > 30;
  pkt.forEach((p, n) => { if (!dicht || n === pkt.length - 1) s += `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="4" fill="var(--akzent)" stroke="var(--flaeche)" stroke-width="2"/>`; });
  s += achseX(keys, x, H, U);
  keys.forEach((k, i) => {
    const nah = pkt.reduce((a, b) => Math.abs(b.i - i) < Math.abs(a.i - i) ? b : a);
    s += `<rect class="hit" x="${L + slot * i}" y="${O}" width="${slot}" height="${H - O - U}" data-tt="${esc(kurzDatum(nah.k) + '\n' + zahl(nah.v, 1) + ' kg')}"/>`;
  });
  elG.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Gewichtsverlauf">${s}</svg>`;
}

  const v = { name, kcal: w(kcal), e: w(n.proteins_100g), k: w(n.carbohydrates_100g), f: w(n.fat_100g) };
  const fehlt = [v.kcal, v.e, v.k, v.f].some(x => x == null);

    }
    if (teile.every(Boolean) && !rezNach(v.name)) D.rezepte.push({ name: v.name, teile });
  }

  for (const r of D.rezepte) for (const t of r.teile) {
